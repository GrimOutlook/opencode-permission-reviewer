name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "36 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported Bun (matches engines.bun >=1.3.0) and the pinned
        # current version. A drift in either direction surfaces before main.
        bun: ["1.3.0", "1.3.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Coverage numbers are reported against the pinned current version.
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  # Stable required-check name for branch protection. Matrix leg names change
  # when Bun versions drift; this gate does not.
  ci:
    name: ci
    if: always()
    needs: [check, coverage, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI checks green
        run: |
          [ "${{ needs.check.result }}" = "success" ] || { echo "check failed: ${{ needs.check.result }}"; exit 1; }
          [ "${{ needs.coverage.result }}" = "success" ] || { echo "coverage failed: ${{ needs.coverage.result }}"; exit 1; }
          [ "${{ needs.audit.result }}" = "success" ] || { echo "audit failed: ${{ needs.audit.result }}"; exit 1; }
