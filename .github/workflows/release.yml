name: release

# Tag-driven release pipeline. Pushing a `v*` tag builds the package,
# publishes to npm with provenance, generates a SHA-256 checksum file and an
# SBOM, and creates a GitHub Release with all artifacts attached.
#
# Prerequisites (configure once in repo settings):
#   - Secret `NPM_TOKEN` with publish rights for `opencode-permission-reviewer`.
#   - Actions → General → "Workflow permissions" allows id-token writes
#     (required for npm --provenance).
#
# Release authorization: a pushed tag is only a request to release. The job
# refuses to build or publish unless the tag commit is reachable from the
# protected release branch (`main`), so only reviewed, merged commits can be
# published. Protect `v*` tags in repo settings (Rules → Tag rulesets) so that
# only maintainers can create them; the reachability check is the in-workflow
# backstop that holds even if that protection is missing.
#
# Versioning: tags matching `vX.Y.Z` publish to the `latest` dist-tag; tags
# matching `vX.Y.Z-<pre>` (e.g. `v1.0.0-rc.1`) publish to the `next`
# dist-tag so prereleases do not replace the stable release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the CHANGELOG extraction can locate the version
          # and the tag-reachability check can walk to the release branch.
          fetch-depth: 0

      # A pushed `v*` tag is attacker-controllable if tag protection is ever
      # missing or bypassed, and the version check below only compares the tag
      # name with package.json — contents from any commit would pass it. Refuse
      # to build or publish anything that is not already on the protected
      # release branch, so only reviewed, merged commits can be released.
      - name: Verify tag commit is reachable from the release branch
        env:
          RELEASE_BRANCH: main
        run: |
          set -euo pipefail
          tag_commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/${RELEASE_BRANCH}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($tag_commit) is not reachable from ${RELEASE_BRANCH}."
            echo "Only commits merged into the protected release branch may be released."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} resolves to $tag_commit, reachable from ${RELEASE_BRANCH}."

      - name: Read tag metadata
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Prerelease if the version contains a hyphen (semver pre-release).
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Guard against mistags: the tag version must match package.json.
      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${{ steps.meta.outputs.version }}" != "$pkg_version" ]; then
            echo "Tag version ${{ steps.meta.outputs.version }} != package.json version $pkg_version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - run: bun install --frozen-lockfile

      # Build must pass the same gate as CI before we cut an artifact.
      - name: Build
        run: bun run check

      # Pack into a tarball and verify the ship set.
      - name: Pack
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          echo "##[group]Tarball contents"
          tar -tzf artifacts/*.tgz | sort
          echo "##[endgroup]"

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum *.tgz > checksums-sha256.txt
          cat checksums-sha256.txt

      # Install Node/npm for publishing. setup-node configures the npm
      # registry auth from NODE_AUTH_TOKEN via .npmrc automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Publish to npm with build provenance (signed OIDC attestation).
      # Provenance requires publishing from the repo root (with .git present),
      # so we do not pass the pre-packed tarball here; npm packs internally.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish \
            --provenance \
            --access public \
            --tag "${{ steps.meta.outputs.dist_tag }}"

      # Generate a CycloneDX SBOM from the extracted tarball contents.
      - name: Generate SBOM
        run: |
          mkdir -p sbom-src
          tar -xzf artifacts/*.tgz -C sbom-src --strip-components=1
      - uses: anchore/sbom-action@v0
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: artifacts/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Create the GitHub Release with notes extracted from CHANGELOG.md.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the matching section from CHANGELOG.md (falls back to
          # auto-generated notes if the section is not found).
          version="${{ steps.meta.outputs.version }}"
          notes=$(awk -v v="$version" '
            /^## \[/ { in_section=0 }
            $0 ~ "^## \\[" v "\\]" { in_section=1; next }
            in_section { print }
          ' CHANGELOG.md)

          tag="${{ steps.meta.outputs.tag }}"
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            gh release create "$tag" --title "$tag" --target main --prerelease
          else
            gh release create "$tag" --title "$tag" --target main
          fi

          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" | gh release edit "$tag" --notes-file -
          else
            gh release edit "$tag" --generate-notes
          fi

          gh release upload "$tag" \
            artifacts/*.tgz \
            artifacts/checksums-sha256.txt \
            artifacts/sbom.cdx.json \
            --clobber
