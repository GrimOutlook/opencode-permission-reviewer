version: 2
updates:
  # Bun updates both package.json and bun.lock in the same PR.
  # Exact-pinned runtime packages (@opentui/*, solid-js) carry native artifacts;
  # DEPENDENCIES.md records the review checklist and the outcome for each bump.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Non-breaking type+patch updates batch together.
      patch-and-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
