# Disable blank issues — route people through structured templates so we get
# the diagnostics needed to reproduce (especially adapter/version data).
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability report
    url: https://github.com/GrimOutlook/opencode-permission-reviewer/security/advisories/new
    about: Report a security bug privately. Do not file a public issue for security vulnerabilities.
  - name: OpenCode documentation
    url: https://opencode.ai/docs
    about: Questions about OpenCode itself (not this plugin) are best asked in the OpenCode docs/community.
